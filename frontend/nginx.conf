server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Una frase ocupa como mucho unos 1,7 KB en JSON (280 caracteres escapados,
    # 6 bytes cada uno). El 413 sale en JSON con la estructura uniforme de
    # errores (RN-16, D-39); su texto está también en documentacion.py y un
    # test del backend comprueba que coinciden.
    client_max_body_size 16k;
    error_page 413 = @cuerpo_demasiado_grande;

    location @cuerpo_demasiado_grande {
        default_type application/json;
        return 413 '{"codigo":"CUERPO_DEMASIADO_GRANDE","mensaje":"La petición es demasiado grande."}';
    }

    # Mismo origen: la interfaz en / y la API en /api, sin CORS (plan §9).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
