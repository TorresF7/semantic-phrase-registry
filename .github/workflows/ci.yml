# Integración continua (T-16). Tres trabajos independientes: la suite rápida
# del backend, la de integración contra PostgreSQL con pgvector y el frontend.
# Los tests `slow` (modelo real) no corren aquí: descargarían 470 MB en cada
# ejecución (plan §7).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos y suite rápida)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # torch primero y desde el índice de CPU: el de PyPI arrastra CUDA y la
      # instalación tarda diez minutos (plan §9). La versión sale de
      # pyproject.toml para no duplicarla.
      - name: Instalar dependencias
        run: |
          torch="$(grep -o '"torch==[^"]*"' pyproject.toml | tr -d '"')"
          pip install --index-url https://download.pytorch.org/whl/cpu "$torch"
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check . && ruff format --check .

      - name: mypy
        run: mypy app tests/dobles

      - name: pytest (suite rápida)
        run: pytest -m "not slow and not integration"

  integracion:
    name: Backend (integración con PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: banco
          POSTGRES_PASSWORD: banco
          POSTGRES_DB: banco_frases_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banco -d banco_frases_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Credenciales de un contenedor efímero de CI, no un secreto.
    env:
      TEST_DATABASE_URL: postgresql+psycopg://banco:banco@localhost:5432/banco_frases_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          torch="$(grep -o '"torch==[^"]*"' pyproject.toml | tr -d '"')"
          pip install --index-url https://download.pytorch.org/whl/cpu "$torch"
          pip install -e ".[dev]"

      # env.py lee DATABASE_URL: se apunta a la base de test solo para migrar,
      # igual que scripts/preparar_base_test.sh.
      - name: Migrar la base de test
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: pytest (integración)
        run: pytest -m integration

  frontend:
    name: Frontend (tipos, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: tsc
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

      - name: build
        run: npm run build
