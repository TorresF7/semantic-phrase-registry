# Política de contenido por ruta (D-40). La app no carga nada de fuera ni
# ejecuta código en línea. Swagger UI, que sirve FastAPI en /api/v1/docs, carga
# su JS y su CSS de jsDelivr, arranca con un script en línea y usa el favicon
# de fastapi.tiangolo.com: solo esa ruta los permite.
map $uri $politica_contenido {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/api/v1/docs "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin versión en la cabecera Server ni en las páginas de error.
    server_tokens off;

    # A nivel de server y con `always`, para que lleguen también a los errores
    # y a las respuestas de la API. Ninguna location define add_header propio:
    # si lo hiciera, dejaría de heredar estas (D-40).
    add_header Content-Security-Policy $politica_contenido always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Una frase ocupa como mucho unos 1,7 KB en JSON (280 caracteres escapados,
    # 6 bytes cada uno). El 413 sale en JSON con la estructura uniforme de
    # errores (RN-16, D-39); su texto está también en documentacion.py y un
    # test del backend comprueba que coinciden.
    client_max_body_size 16k;
    error_page 413 = @cuerpo_demasiado_grande;

    location @cuerpo_demasiado_grande {
        default_type application/json;
        return 413 '{"codigo":"CUERPO_DEMASIADO_GRANDE","mensaje":"La petición es demasiado grande."}';
    }

    # Mismo origen: la interfaz en / y la API en /api, sin CORS (plan §9).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
